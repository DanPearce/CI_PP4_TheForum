<!--Base HTML Template-->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!--Meta Tags-->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="theforum, start the conversation today">
    <meta name="keywords" content="the, forum, news, blog, conversation">
    <!--Favicon, Bootstrap, Font Awesome, fonts & stylesheets-->
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'images/favicon-96x96.png' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" rel="stylesheet" integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/portfolio-header.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>theforum</title>
</head>
<body class="d-flex flex-column min-vh-100 dp-has-bar">
<dp-header logo="{% static 'images/DANPEARCE.png' %}?v=2"></dp-header>
    <header>
        <!--Logo & Navbar with Collapsible Functionality-->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}"><span class="logo"><strong><span class="the">the</span><span class="forum">forum</span></strong></span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav justify-content-end ms-auto">
                        {% if user.is_authenticated %}
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'account_logout' %}">Logout</a>
                        </li>
                        {% else %}
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'account_login' %}">Login</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'account_signup' %}">Sign Up</a>
                        </li>
                        {% endif %}
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'contact' %}">Contact Us</a>
                        </li>               
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container-fluid flex-shrink-0" id="main">
    {% block content %}
    <!--Block Content from Additional Templates will insert here.-->
    {% endblock content %}
    </main>
    <!--Footer-->
    <footer class="footer mt-auto">
        <ul class="socials text-center m-0">
            <li>
                <a href="https://www.instagram.com/dnlpearce/" target="_blank" rel="noopener" aria-label="Visit the developer's Instagram page (opens in a new tab)"><i class="fa-brands fa-instagram"></i></a>
            </li>
            <li>
                <a href="https://www.linkedin.com/in/danielanthonypearce/" target="_blank" rel="noopener" aria-label="Visit the developer's LinkedIn page (opens in a new tab)"><i class="fa-brands fa-linkedin-in"></i></a>
            </li>
            <li>
                <a href="https://x.com/dnlpearce" target="_blank" rel="noopener" aria-label="Visit the developer's X page (opens in a new tab)"><i class="fa-brands fa-x-twitter"></i></a>
            </li>
            <li>
                <a href="https://github.com/DanPearce/CI_PP4_TheForum" target="_blank" rel="noopener" aria-label="View the code on the developer's GitHub page (opens in a new tab)"><i class="fa-brands fa-github"></i></a>
            </li>
        </ul>
        <p class="footerSignature">COPYRIGHT &copy; 2026 DAN PEARCE</p>
        <p class="footerSignature">Website developed by Dan Pearce<br><a href="https://danielpearce.co.uk/" target="_blank" rel="noopener" aria-label="Visit Dan Pearce's website (opens in a new tab)">danielpearce.co.uk</a></p>
    </footer>
<!--JavaScript: Bootstrap, the portfolio header menu and the site script-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="{% static 'js/portfolio-header.js' %}?v=2"></script>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
